services:
  db:
    image: postgres:16
    container_name: adaremise-db
    environment:
      POSTGRES_USER: adaremise_user
      POSTGRES_PASSWORD: motdepasse123
      POSTGRES_DB: adaremise
    ports:
      - "5432:5432"
    volumes:
      - ./back/db/migration_up.sql:/docker-entrypoint-initdb.d/01-migration_up.sql
      - ./back/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: